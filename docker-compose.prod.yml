services:
  db:
    image: postgres:17-alpine
    container_name: musicatte-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musicatte}
      POSTGRES_USER: ${POSTGRES_USER:-musicatte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musicatte} -d ${POSTGRES_DB:-musicatte}"]
      interval: 10s
      timeout: 3s
      retries: 5

  homr:
    build:
      context: .
      dockerfile: homr.Dockerfile
      args:
        HOMR_REF: ${HOMR_REF:-v0.6.0}
    container_name: musicatte-homr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 180s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: musicatte-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      homr:
        condition: service_healthy
    environment: &backend_env
      APP_NAME: Musicatte API
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-musicatte}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-musicatte}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-1440}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-16777216}
      HOMR_URL: http://homr:8000
      HOMR_TIMEOUT_SECONDS: ${HOMR_TIMEOUT_SECONDS:-600}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-15}
      OCR_VARIANTS: ${OCR_VARIANTS:-2}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      # The dedicated worker service below drains the queue.
      RUN_INLINE_WORKER: "0"
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      - backend_uploads:/app/uploads

  # Recognition is CPU-bound and runs for minutes at a time, so it gets its
  # own container instead of competing with request handling. The queue lives
  # in the database, so this can be scaled to several replicas and a restart
  # requeues whatever was in flight rather than losing it.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: musicatte-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      homr:
        condition: service_healthy
    environment: *backend_env
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.musicatte.com}
    container_name: musicatte-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8020}:80"

volumes:
  postgres_data:
  backend_uploads:
