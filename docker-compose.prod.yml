services:
  db:
    image: postgres:17-alpine
    container_name: musicatte-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musicatte}
      POSTGRES_USER: ${POSTGRES_USER:-musicatte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musicatte} -d ${POSTGRES_DB:-musicatte}"]
      interval: 10s
      timeout: 3s
      retries: 5

  homr:
    build:
      context: .
      dockerfile: homr.Dockerfile
    container_name: musicatte-homr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: musicatte-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      homr:
        condition: service_healthy
    environment:
      APP_NAME: Musicatte API
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-musicatte}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-musicatte}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-1440}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-16777216}
      HOMR_URL: http://homr:8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.musicatte.com}
    container_name: musicatte-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8020}:80"

volumes:
  postgres_data:
  backend_uploads:
